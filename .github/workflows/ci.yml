name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Системные библиотеки для Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Проверка синтаксиса
        run: python -m compileall -q nevexona_droid
      - name: Тесты (включая окно в offscreen)
        run: python -m pytest -v
      - name: Сборка .deb
        run: ./packaging/build_deb.sh
      - name: Проверка пакета
        run: dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb
      - name: ZIP с исходниками
        run: git archive --format=zip -o dist/nevexona-droid-src.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: nevexona-droid
          path: dist/*
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "NEVEXONA Droid $GITHUB_REF_NAME" --generate-notes
